$schema: https://github.com/alxroyer/scenario/blob/master/schemas/req-db_v0.3.0.schema.json
$version: 0.2.2
ALTERNATIVE_SCENARIOS:
  id: ALTERNATIVE_SCENARIOS
  text: 'A scenario may be derived from another one

    (basically an error scenario derivating from a nominal one),

    which can be done through different means:


    - Step picking,

    - Partial subscenarios execution,

    - Inheritance.'
  title: Alternative scenarios
ATTRIBUTES:
  id: ATTRIBUTES
  text: 'Scenario attributes can be set with scenario definitions.


    They consist in free fields that are:


    - displayed in the console with scenario logging (see SCENARIO_LOGGING),

    - stored in scenario reports (see SCENARIO_REPORT).


    They may be displayed with scenario results,

    when executing multiple scenarios (see MULTIPLE_SCENARIO_EXECUTION),

    or when executing a campaign (see CAMPAIGNS).


    The `scenario` framework defines the following core attributes:


    - TITLE: short title (displayed by default with MULTIPLE_SCENARIO_EXECUTION),

    - DESCRIPTION: more detailed description for the scenario.'
  title: Scenario attributes
CAMPAIGNS:
  id: CAMPAIGNS
  subrefs:
  - CAMPAIGNS/logging
  - CAMPAIGNS/reports
  text: 'A campaign is the execution of a set of test suites, each being a set of
    test cases, i.e. scenarios.

    Whether the tests succeed or fail, the campaign keeps going on.


    An output directory is fed with the following files:

    - test results: log files and reports (see SCENARIO_LOGGING and SCENARIO_REPORT
    files),

    - a requirement file, if requirements are involved (see REQUIREMENT_MANAGEMENT),

    - a JUnit XML campaign report (format: XML Junit, schema: JUnit + `scenario` augmentations).


    The log output, in the end, gives a summary of the scenario execution status,
    and highlights the errors and warnings

    (see MULTIPLE_SCENARIO_EXECUTION).'
  title: Campaign executions
CONFIG_DB:
  id: CONFIG_DB
  text: 'The scenario framework provides a general configuration database.

    This database may be fed with configuration files or single values,

    either from the command line or programmatically.

    Configuration files may be in the INI, JSON or YAML format.


    Configurations are key-value pairs.

    Keys are in the ''section.subsection.(...).leaf'' form (1).

    The configuration database also handles lists of values or sub-sections (2).

    Final values can be basic types like strings, integers or float numbers.


    (1) For INI files, the use of the dot character in section names can be used to
    declare sub-sections.


    (2) No lists available with INI files.


    When several configuration files are given,

    the configuration values from the latter overloads the ones from the formers.


    Configuration files may also be saved from the configuration database eventually.'
  title: General configuration database
DEBUG_LOGGING:
  id: DEBUG_LOGGING
  text: The logging facilites makes it possible to activate dynamically debug logging
    for each log class.
  title: Debug logging facilities
DOC_ONLY:
  id: DOC_ONLY
  text: The scenario framework shall generate the test documentation without executing
    the test.
  title: Documentation generation
ERROR_HANDLING:
  id: ERROR_HANDLING
  text: 'When an exception is thrown, the step ends in error immediately.

    The consecutive steps are not executed by default.

    The error information is eventually stored and displayed to help investigating
    on it.

    The test status falls to FAIL (see SCENARIO_EXECUTION).


    Error known issues (see KNOWN_ISSUES) also make the test status fall to FAIL,

    but they don''t break the test execution.'
  title: Error handling
EVIDENCE:
  id: EVIDENCE
  text: 'Evidence may be saved in the test reports

    with their related actions and expected results.'
  title: Evidence collection
GOTO:
  id: GOTO
  text: A scenario execution shall jump to another step within the scenario.
  title: Jumping to another step
KNOWN_ISSUES:
  id: KNOWN_ISSUES
  text: 'Known issues may be registered at the scenario definition level,

    or during test execution.


    By default, known issues generate execution warnings.

    These warnings are stored in reports,

    and make the test status fall to WARNINGS (see SCENARIO_EXECUTION)

    unless the test is executed in --doc-only mode.


    Known issues may be registered with an optional issue level,

    an ``int`` value possibly linked with a meaningful name.

    When an error issue level threshold is set, issue levels from and above are considered
    as errors (see ERROR_HANDLING).

    When an ignored issue level threshold is set, issue levels from and under are
    ignored.


    Known issues may also be registered with an optional issue id,

    referencing a ticket in a tier bugtracking system.

    A URL builder handler may be configured in order to facilitate the navigation
    to from test reports.'
  title: Known issues
LOGGING:
  id: LOGGING
  subrefs:
  - LOGGING/file
  text: 'The scenario framework provides logging facilities

    with the following characteristics in order to ease test execution analyses:


    - Date/time timestamps,

    - Log levels: ERROR, WARNING, INFO, DEBUG,

    - Log classes,

    - Log level colorization,

    - Log class colorization,

    - Scenario stack indentation,

    - Additional user indentation,

    - Console logging (by default) and/or file logging.'
  title: Logging facilities
MULTIPLE_SCENARIO_EXECUTION:
  id: MULTIPLE_SCENARIO_EXECUTION
  text: 'Several scenarios may be executed with a single command line.

    Whether the tests succeed or fail, the command line executes every scenario given.

    The log output, in the end, gives a summary of the scenario execution status,
    and highlights the errors and warnings.'
  title: Multiple scenario execution
REQUIREMENT_MANAGEMENT:
  id: REQUIREMENT_MANAGEMENT
  subrefs:
  - REQUIREMENT_MANAGEMENT/reports
  - REQUIREMENT_MANAGEMENT/scenario-consolidation
  text: 'The scenario framework provides a way to track requirements, and cover them
    by tests with justification.


    Requirements are defined in a requirement database.

    This database can be saved and reloaded throught requirement files

    (format: JSON or YAML, schema: schema/req-db.schema.json).


    Requirements may be traced at different levels:


    - On the requirement side: requirements may be traced entirely, or just parts
    of them.

    - On the test side: the requirement item may be traced either by test scenarios
    and/or steps.


    These associations define requirement links which may be commented with textual
    justifications.


    The scenario framework provides a way to generate requirement traceability reports

    (format: JSON or YAML, schema: schema/downstream-traceability.schema.json and
    schema/upstream-traceability.schema.json):


    - either from test suite files,

    - or from campaign execution results (see CAMPAIGNS).


    For a given scenario, a consolidation may be done between:


    - the declared set of requirement coverage,

    - and the coverage declared from its steps.'
  title: Requirement management
SCENARIO_EXECUTION:
  id: SCENARIO_EXECUTION
  text: 'A scenario is an assertive context that defines an ordered list of test steps.


    Each step contains a description, test actions and expected results.


    A scenario execution gives a final status:


    - SUCCESS,

    - WARNINGS (in case of known issues, see KNOWN_ISSUES),

    - FAIL (see ERROR_HANDLING).'
  title: Scenario steps execution
SCENARIO_LOGGING:
  id: SCENARIO_LOGGING
  subrefs:
  - SCENARIO_LOGGING/action-result-indentation
  text: 'The scenario execution provides log information that lets the tester know
    the useful information about it:


    - The name of the scenario being executed,

    - The scenario attributes declared with it (see ATTRIBUTES),

    - The steps, actions and expected results being executed,

    - The errors that occurred (see ERROR_HANDLING),

    - The evidence collected (see EVIDENCE),

    - The known issues registered (see KNOWN_ISSUES),

    - The final status of the test execution.


    The main logger indentation (see LOGGING) may be used to set ACTION/RESULT indentation.

    The ACTION/RESULT indentation is save at definition time.'
  title: '`scenario` logging'
SCENARIO_REPORT:
  id: SCENARIO_REPORT
  text: 'A scenario execution shall output a report file

    (format: JSON or YAML, schema: schema/scenario-report.schema.json).


    This report saves a structured information for a test execution.

    See SCENARIO_LOGGING for the list of items that scenario reports contain.'
  title: Scenario reports
STATISTICS:
  id: STATISTICS
  text: The scenario execution shall give statistics on the number of steps, actions
    and expected results.
  title: Scenario execution statistics
STEP_PICKING:
  id: STEP_PICKING
  text: A scenario shall be constituted by picking steps already defined.
  title: Step picking
SUBSCENARIOS:
  id: SUBSCENARIOS
  text: A scenario shall execute all or part of other scenarios as subscenarios.
  title: Subscenarios
