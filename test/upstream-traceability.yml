      comments: Scenario logging with errors
      title: '`scenario` logging'
    SCENARIO_REPORT:
      comments: Scenario report with errors
      title: Scenario reports
  steps:
    step#1:
      description: '''test/data/failingscenario.py'' execution'
      location: test/cases/errors/failingscenario001.py:56:FailingScenario001.__init__
      name: step#1 (ExecScenario)
      reqs:
        ERROR_HANDLING:
          title: Error handling
    step#3:
      location: test/cases/errors/failingscenario001.py:61:FailingScenario001.__init__
      name: step#3 (CheckScenarioLogExpectations)
      reqs:
        ERROR_HANDLING:
          title: Error handling
        SCENARIO_LOGGING:
          comments: Actions & expected results displayed until the error occurs
          title: '`scenario` logging'
    step#4:
      location: test/cases/errors/failingscenario001.py:65:FailingScenario001.__init__
      name: step#4 (CheckLogOutputExceptionDisplay)
      reqs:
        ERROR_HANDLING:
          title: Error handling
        SCENARIO_LOGGING:
          comments: Traceback displayed
          title: '`scenario` logging'
    step#5:
      location: test/cases/errors/failingscenario001.py:74:FailingScenario001.__init__
      name: step#5 (CheckScenarioReportExpectations)
      reqs:
        ERROR_HANDLING:
          title: Error handling
        SCENARIO_REPORT:
          comments: All actions & expected results definitions saved, executed until
            the error occurs
          title: Scenario reports
    step#6:
      location: test/cases/errors/failingscenario001.py:78:FailingScenario001.__init__
      name: step#6 (CheckScenarioReportExceptionStorage)
      reqs:
        ERROR_HANDLING:
          title: Error handling
        SCENARIO_REPORT:
          comments: 'Error storage at each level: scenario, step, action & expected
            result'
          title: Scenario reports
  title: Failing scenario execution
