test/cases/campaigns/campaign001.py:
  description: 'Check that the campaign runner can execute a test suite file (CAMPAIGNS),
    gather the test case log files (LOGGING), reports (SCENARIO_REPORT) and statistics
    (STATISTICS), and produce the campaign report (CAMPAIGNS) and requirement file
    (REQUIREMENT_MANAGEMENT).

    Check furthermore that error display makes it easy to investigate on errors and
    warnings (MULTIPLE_SCENARIO_EXECUTION, ERROR_HANDLING & KNOWN_ISSUES).'
  reqs:
    ATTRIBUTES:
      comments: Scenario attributes in campaign reports
      title: Scenario attributes
    CAMPAIGNS:
      comments: Single test suite
      title: Campaign executions
    ERROR_HANDLING:
      comments: A scenario error is tracked and does not break the campaign
      title: Error handling
    KNOWN_ISSUES:
      comments: Known issues reported from scenario to campaign reports
      title: Known issues
    LOGGING:
      subrefs:
        LOGGING/file:
          comments: Scenario log files gathered with campaign reports
          title: Logging facilities (LOGGING/file)
      title: Logging facilities
    MULTIPLE_SCENARIO_EXECUTION:
      comments: Campaign final results
      title: Multiple scenario execution
    REQUIREMENT_MANAGEMENT:
      comments: Requirements in campaign reports
      title: Requirement management
    SCENARIO_LOGGING:
      comments: Scenario log files gathered with campaign reports
      title: '`scenario` logging'
    SCENARIO_REPORT:
      comments: Scenario reports gathered with campaign reports
      title: Scenario reports
    STATISTICS:
      comments: Statistics by scenario, integrated for the campaign
      title: Scenario execution statistics
  steps:
    step#2:
      location: test/cases/campaigns/campaign001.py:92:Campaign001.__init__
      name: step#2 (CheckCampaignLogExpectations)
      reqs:
        CAMPAIGNS:
          subrefs:
            CAMPAIGNS/logging:
              comments: Main campaign logging
              title: Campaign executions (CAMPAIGNS/logging)
          title: Campaign executions
        ERROR_HANDLING:
          comments: Scenario errors logged with main campaign logging
          title: Error handling
        KNOWN_ISSUES:
          comments: Known issues logged with main campaign logging
          title: Known issues
    step#4:
      location: test/cases/campaigns/campaign001.py:99:Campaign001.__init__
      name: step#4 (CheckFinalResultsLogExpectations)
      reqs:
        CAMPAIGNS:
          subrefs:
            CAMPAIGNS/logging:
              comments: Campaign final results
              title: Campaign executions (CAMPAIGNS/logging)
          title: Campaign executions
        ERROR_HANDLING:
          comments: Scenario errors logged with campaign final results
          title: Error handling
        KNOWN_ISSUES:
          comments: Known issues logged with campaign final results
          title: Known issues
        STATISTICS:
          comments: Statistics logged with campaign final results
          title: Scenario execution statistics
    step#5:
      location: test/cases/campaigns/campaign001.py:107:Campaign001.__init__
      name: step#5 (CheckCampaignOutdirFiles)
      reqs:
        CAMPAIGNS:
          subrefs:
            CAMPAIGNS/logging:
              comments: Campaign output files
              title: Campaign executions (CAMPAIGNS/logging)
          title: Campaign executions
        LOGGING:
          subrefs:
            LOGGING/file:
              comments: Scenario log files saved with campaign output files
              title: Logging facilities (LOGGING/file)
          title: Logging facilities
        REQUIREMENT_MANAGEMENT:
          comments: Requirements saved with campaign output files
          title: Requirement management
        SCENARIO_REPORT:
          comments: Scenario reports saved with campaign output files
          title: Scenario reports
    step#6:
      location: test/cases/campaigns/campaign001.py:114:Campaign001.__init__
      name: step#6 (CheckCampaignReport)
      reqs:
        CAMPAIGNS:
          subrefs:
            CAMPAIGNS/reports:
              comments: Campaign report content
              title: Campaign executions (CAMPAIGNS/reports)
          title: Campaign executions
        ERROR_HANDLING:
          comments: Scenario errors saved in campaign report content
          title: Error handling
        KNOWN_ISSUES:
          comments: Known issues saved in campaign report content
          title: Known issues
        STATISTICS:
          comments: Statistics saved in campaign report content
          title: Scenario execution statistics
    step#7:
      location: test/cases/campaigns/campaign001.py:136:Campaign001.__init__
      name: step#7 (CheckCampaignScenarioReports)
      reqs:
        ATTRIBUTES:
          comments: Attributes saved in scenario reports in campaign output files
          title: Scenario attributes
        CAMPAIGNS:
          subrefs:
            CAMPAIGNS/reports:
              comments: Scenario report content in campaign output files
              title: Campaign executions (CAMPAIGNS/reports)
          title: Campaign executions
        ERROR_HANDLING:
          comments: Scenario errors saved in scenario reports in campaign output files
          title: Error handling
        KNOWN_ISSUES:
          comments: Known issues saved in scenario reports in campaign output files
          title: Known issues
        SCENARIO_REPORT:
          comments: Scenario report content in campaign output files
          title: Scenario reports
        STATISTICS:
          comments: Statistics saved in scenario reports in campaign output files
          title: Scenario execution statistics
    step#8:
      location: test/cases/campaigns/campaign001.py:145:Campaign001.__init__
      name: step#8 (CheckCampaignReqDbFile)
      reqs:
        CAMPAIGNS:
          subrefs:
            CAMPAIGNS/reports:
              comments: Requirement file content in campaign output files
              title: Campaign executions (CAMPAIGNS/reports)
          title: Campaign executions
        REQUIREMENT_MANAGEMENT:
          comments: Requirement file content in campaign output files
          title: Requirement management
  title: Campaign execution & reports
