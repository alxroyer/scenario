      title: Campaign & requirement file
    test/cases/misc/textutils001.py:
      comments: Long texts for requirements & requirement link comments
      title: Long texts
    test/cases/reqmgt/reqmgt010.py:
      title: Requirement database and queries
    test/cases/scenarioreport/scenarioreport060.py:
      comments: Long texts for requirements link comments
      title: Scenario report long texts
    test/cases/scenarioreport/scenarioreport061.py:
      comments: Long texts for requirements link comments
      title: Scenario report long texts --doc-only
  subrefs:
    REQUIREMENT_MANAGEMENT/reports:
      scenarios: {}
      title: Requirement management (REQUIREMENT_MANAGEMENT/reports)
    REQUIREMENT_MANAGEMENT/scenario-consolidation:
      scenarios: {}
      title: Requirement management (REQUIREMENT_MANAGEMENT/scenario-consolidation)
  text: 'The scenario framework provides a way to track requirements, and cover them
    by tests with justification.


    Requirements are defined in a requirement database.

    This database can be saved and reloaded throught requirement files

    (format: JSON or YAML, schema: schema/req-db.schema.json).


    Requirements may be traced at different levels:


    - On the requirement side: requirements may be traced entirely, or just parts
    of them.

    - On the test side: the requirement item may be traced either by test scenarios
    and/or steps.


    These associations define requirement links which may be commented with textual
    justifications.


    The scenario framework provides a way to generate requirement traceability reports

    (format: JSON or YAML, schema: schema/downstream-traceability.schema.json and
    schema/upstream-traceability.schema.json):


    - either from test suite files,

    - or from campaign execution results (see CAMPAIGNS).


    For a given scenario, a consolidation may be done between:


    - the declared set of requirement coverage,

    - and the coverage declared from its steps.'
  title: Requirement management
SCENARIO_EXECUTION:
  scenarios:
    test/cases/issues/issue003.py:
      title: 'Issue #3! Actions / Results differenciation even at the same location'
    test/cases/misc/textutils001.py:
      comments: Long texts for actions & expected results
      title: Long texts
    test/cases/scenarioexecution/inheritance001.py:
      title: Inheritance & step order
    test/cases/scenarioexecution/scenarioexecution001.py:
      title: Scenario execution
    test/cases/scenariologging/scenariologging060.py:
      comments: Long texts for actions & expected results
      title: Scenario logging long texts
    test/cases/scenariologging/scenariologging061.py:
      comments: Long texts for actions & expected results
      title: Scenario logging long texts --doc-only
    test/cases/scenarioreport/scenarioreport060.py:
      comments: Long texts for actions & expected results
      title: Scenario report long texts
    test/cases/scenarioreport/scenarioreport061.py:
      comments: Long texts for actions & expected results
      title: Scenario report long texts --doc-only
  text: 'A scenario is an assertive context that defines an ordered list of test steps.


    Each step contains a description, test actions and expected results.


    A scenario execution gives a final status:


    - SUCCESS,

    - WARNINGS (in case of known issues, see KNOWN_ISSUES),

    - FAIL (see ERROR_HANDLING).'
  title: Scenario steps execution
SCENARIO_LOGGING:
  scenarios:
    test/cases/campaigns/campaign001.py:
      comments: Scenario log files gathered with campaign reports
      title: Campaign execution & reports
    test/cases/doconly/doconly001.py:
      comments: Scenario logging with --doc-only
      title: --doc-only execution
    test/cases/errors/failingscenario001.py:
      comments: Scenario logging with errors
      steps:
