  text: 'A campaign is the execution of a set of test suites, each being a set of
    test cases, i.e. scenarios.

    Whether the tests succeed or fail, the campaign keeps going on.


    An output directory is fed with the following files:

    - test results: log files and reports (see SCENARIO_LOGGING and SCENARIO_REPORT
    files),

    - a requirement file, if requirements are involved (see REQUIREMENT_MANAGEMENT),

    - a JUnit XML campaign report (format: XML Junit, schema: JUnit + `scenario` augmentations).


    The log output, in the end, gives a summary of the scenario execution status,
    and highlights the errors and warnings (see MULTIPLE_SCENARIO_EXECUTION).'
  title: Campaign executions
