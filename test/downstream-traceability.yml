      comments: Attribute display with scenario logging
      title: Scenario logging simple scenario
    test/cases/scenariologging/scenariologging011.py:
      comments: Attribute display in scenario logging --doc-only
      title: Scenario logging simple scenario --doc-only
    test/cases/scenariologging/scenariologging060.py:
      comments: Long texts for scenario descriptions
      title: Scenario logging long texts
    test/cases/scenariologging/scenariologging061.py:
      comments: Long texts for scenario descriptions
      title: Scenario logging long texts --doc-only
    test/cases/scenarioreport/scenarioreport060.py:
      comments: Long texts for scenario descriptions
      title: Scenario report long texts
    test/cases/scenarioreport/scenarioreport061.py:
      comments: Long texts for scenario descriptions
      title: Scenario report long texts --doc-only
  text: 'Scenario attributes can be set with scenario definitions.


    They consist in free fields that are:


    - displayed in the console with scenario logging (see SCENARIO_LOGGING),

    - stored in scenario reports (see SCENARIO_REPORT).


    They may be displayed with scenario results,

    when executing multiple scenarios (see MULTIPLE_SCENARIO_EXECUTION),

    or when executing a campaign (see CAMPAIGNS).


    The `scenario` framework defines the following core attributes:


    - TITLE: short title (displayed by default with MULTIPLE_SCENARIO_EXECUTION),

    - DESCRIPTION: more detailed description for the scenario.'
  title: Scenario attributes
