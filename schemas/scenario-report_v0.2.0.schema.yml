$schema: https://json-schema.org/draft/2020-12/schema

$id: https://github.com/alxroyer/scenario/blob/master/schemas/scenario-report_v0.2.0.schema.json
title: Scenario report v0.2.0
description: Schema that describes the report of a scenario executed with --doc-only (scenario definition only) or not (actual scenario execution).

$ref: "#/$defs/main-scenario"

$defs:

  # 1. Main file attributes

  # Main node: Base `_scenario` with a couple of additional attributes.
  main-scenario:
    description: Main scenario.
    type: object
    allOf:

      # Heading properties.
      - description: Heading properties.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/_heading-properties"

      # Base `_scenario`.
      - $ref: "#/$defs/_scenario"

      # Statistics.
      - description: Scenario statistics.
        type: object
        properties:

          # Optional.
          # Note:
          #   Can be inferred from steps with actions / results.
          #   Actually not read by `scenario` when imported.
          stats:
            description: Scenario execution statistics.
            type: object
            properties:

              # Required.
              steps:
                description: Step counters.
                $ref: "#/$defs/_stat-counters"

              # Required.
              actions:
                description: Action counters.
                $ref: "#/$defs/_stat-counters"

              # Required.
              results:
                description: Result counters.
                $ref: "#/$defs/_stat-counters"

            required:
              - steps
              - actions
              - results

  _stat-counters:
    description: Statistic counters.
    type: object
    properties:

      # Required.
      executed:
        description: Number of items executed.
        type: integer

      # Required.
      total:
        description: Total number of items.
        type: integer

    required:
      - executed
      - total

  # 2. Main objects

  # 2.1. Scenario

  # Scenario -- common definition.
  # Defines the base object for `main-scenario` and `subscenario`.
  _scenario:
    description: Base scenario.
    type: object
    allOf:

      # Scenario definition.
      - description: Scenario definition.
        type: object
        properties:

          # Required.
          name:
            description: Name of the scenario.
            $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/non-empty-string"

          # Required.
          href:
            description: Reference to the scenario script path.
            $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/non-empty-string"

          # Required.
          attributes:
            description: Scenario attributes.
            type: object
            patternProperties:
              "^[^$].*$": { type: string }

          # Required.
          steps:
            description: List of steps.
            type: array
            items:
              anyOf:
                - $ref: "#/$defs/step-section"
                - $ref: "#/$defs/step-definition"

      # Base `_execution-results`.
      - $ref: "#/$defs/_execution-results"

      # Execution status.
      - description: Scenario execution status.
        type: object
        properties:

          # Required.
          # Note:
          #   Could be inferred from errors & warnings.
          #   Keep it required whatever.
          status:
            description: Execution status.
            $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/execution-status"

    required:
      - name
      - href
      - attributes
      - steps
      - status

  # Subscenario: Base `_scenario` as a final type.
  subscenario:
    description: Subscenario.
    $ref: "#/$defs/_scenario"


  # 2.2. Steps

  # Step section: essentially a step description.
  step-section:
    description: Step section.
    type: object
    properties:

      # Required.
      location:
        description: Location of the step.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/location"

      # Required.
      description:
        description: Description of the step.
        type: string

    required:
      - location
      - description

    # Make the difference with `step-definition` below.
    unevaluatedProperties: false

  # Full step definition.
  step-definition:
    description: Step definition.
    type: object
    properties:

      # Required.
      location:
        description: Location of the step.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/location"

      # Required.
      description:
        description: Description of the step.
        # Regular step description may be `None`.
        anyOf:
          - type: string
          - type: "null"

      # Required.
      executions:
        description: Step executions.
        type: array
        items: { $ref: "#/$defs/step-execution" }

      # Required.
      actions-results:
        description: List of actions and expected results.
        type: array
        items: { $ref: "#/$defs/action-result-definition" }

    required:
      - location
      - description
      - executions
      - actions-results

  step-execution:
    description: Step execution results.
    type: object
    allOf:

      # Base `_execution-results`.
      - $ref: "#/$defs/_execution-results"

      # Additional properties.
      - type: object
        properties:

          # Required.
          number:
            description: Execution number, starting from 1.
            type: integer
            min: 1

        required:
          - number


  # 2.3. Actions / results

  action-result-definition:
    description: Action / result definition.
    type: object
    properties:

      # Required.
      type:
        description: Action / result type.
        enum:
          - "ACTION"
          - "RESULT"

      # Required.
      description:
        description: Action / result description.
        type: string

      # Required.
      executions:
        description: Action / result executions.
        type: array
        items: { $ref: "#/$defs/action-result-execution" }

    required:
      - type
      - description
      - executions

  action-result-execution:
    description: Action / result execution results.
    type: object
    allOf:

      # Base `_execution-results`.
      - $ref: "#/$defs/_execution-results"

      # Additional properties.
      - type: object
        properties:

          # Required.
          evidence:
            description: Evidence.
            type: array
            items: { type: string }

          # Required.
          subscenarios:
            description: Subscenarios.
            type: array
            items: { $ref: "#/$defs/subscenario" }

        required:
          - evidence
          - subscenarios


  # 2.4. Common objects and types

  _execution-results:
    description: Base execution results.
    type: object
    properties:

      # Required.
      time:
        description: Execution times.
        type: object
        properties:

          # Optional.
          start:
            description: Start time.
            oneOf:
              - $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/iso8601"
              - type: "null"

          # Optional.
          end:
            description: End time.
            oneOf:
              - $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/iso8601"
              - type: "null"

          # Optional.
          elapsed:
            description: Elapsed time in seconds.
            oneOf:
              - type: number
              - type: "null"

      # Required.
      errors:
        description: Errors.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/array-of-errors"

      # Required.
      warnings:
        description: Warnings.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.2.0.schema.json#/$defs/array-of-warnings"

    required:
      - time
      - errors
      - warnings
