$schema: https://json-schema.org/draft/2020-12/schema

$id: https://github.com/alxroyer/scenario/blob/master/schemas/req-db_v0.3.0.schema.json
title: Scenario requirement database v0.3.0
description: Schema that describes a database of requirements for the `scenario` library.

$ref: "#/$defs/main"

$defs:

  # 1. Main database node

  main:
    description: Scenario requirement database.
    type: object

    allOf:

      # Heading properties.
      - description: Heading properties.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/_heading-properties"

      # Properties not starting with '$' are considered as requirement ids.
      - description: Requirements.
        type: object
        patternProperties:
          "^[^$].*$": { $ref: "#/$defs/req" }


  # 2. Requirements

  req:
    description: Requirement.
    type: object
    properties:

      # Required.
      id:
        description: Requirement identifier.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/non-empty-string"

      # Optional.
      title:
        description: Requirement title.
        type: string

      # Optional.
      text:
        description: Requirement text.
        type: string

      # Optional.
      subrefs:
        description: Requirement subreferences.
        type: array
        items: { type: string }

    required:
      - id
