$schema: https://json-schema.org/draft/2020-12/schema

$id: https://github.com/alxroyer/scenario/blob/master/schemas/req-db_v0.3.0.schema.json
title: Scenario requirement database v0.3.0
description: Schema that describes a database of requirements for the `scenario` library.

$ref: "#/$defs/main"

$defs:

  # 1. Main database node

  main:
    description: Scenario requirement database.
    type: object

    # Heading properties.
    # WARNING:
    #   The following `properties` definition is a duplicate of `/$defs/_heading-properties` in 'common_v0.3.0.schema.yml',
    #   but it seems that the `additionalProperties` after can't take effect as a complement of a `$ref` but overrides it.
    #   An inline `properties` definition seems to be required (at least with `jsonschema` implementation).
    properties:
      # Optional.
      $encoding:
        description: Encoding of the file.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/non-empty-string"
      # Optional.
      $license:
        description: Ability to provide a license text for a JSON file.
        anyOf:
          - type: string
          - { type: array, items: { type: string } }
      # Optional.
      $schema:
        description: Schema reference.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/non-empty-string"
      # Optional.
      $version:
        description: "`scenario` version used to generate the file."
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/non-empty-string"

    additionalProperties: { $ref: "#/$defs/req" }


  # 2. Requirements

  req:
    description: Requirement.
    type: object
    properties:

      # Required.
      id:
        description: Requirement identifier.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/non-empty-string"

      # Optional.
      title:
        description: Requirement title.
        type: string

      # Optional.
      text:
        description: Requirement text.
        type: string

      # Optional.
      subrefs:
        description: Requirement subreferences.
        type: array
        items: { type: string }

    required:
      - id
