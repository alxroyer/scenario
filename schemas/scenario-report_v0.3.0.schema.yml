$schema: https://json-schema.org/draft/2020-12/schema

$id: https://github.com/alxroyer/scenario/blob/master/schemas/scenario-report_v0.3.0.schema.json
title: Scenario report v0.3.0
description: Schema that describes the report of a scenario executed with --doc-only (scenario definition only) or not (actual scenario execution)

$ref: "#/$defs/main-scenario"

$defs:

  # 1. Main file attributes

  # Main node: Base `_scenario` with a couple of additional attributes.
  main-scenario:
    description: Main scenario
    type: object
    allOf:

      # Heading properties.
      - description: Heading properties
        type: object
        properties:

          # New in v0.3.0.
          # Optional.
          $encoding:
            description: Encoding of the file
            # Note:
            #   Don't use a restrictive enum definition.
            #   Accept whatever, and let Python raise an exception if the encoding is unknown.
            $ref: "#/$defs/_non-empty-string"

          # New in v0.2.0.
          # Optional.
          $license:
            description: Ability to provide a license text for a JSON file
            anyOf:
              - type: string
              - { type: array, items: { type: string } }

          # Optional.
          $schema:
            description: Schema reference
            # Note:
            #   Don't forbid backward compatible evolutions.
            #   Accept whatever, and let JSON schema validation state on compatibility.
            $ref: "#/$defs/_non-empty-string"

          # New in v0.3.0.
          # Optional.
          $version:
            description: "`scenario` version used to generate the file"
            # Note:
            #   Don't forbid backward compatible evolutions.
            #   Accept whatever, and let JSON schema validation state on compatibility.
            $ref: "#/$defs/_non-empty-string"

      # Base `_scenario`.
      - $ref: "#/$defs/_scenario"

      # Statistics.
      - description: Scenario statistics
        type: object
        properties:

          # Optional.
          # Note:
          #   Can be inferred from steps with actions / results.
          #   Actually not read by `scenario` when imported.
          stats:
            description: Scenario execution statistics
            type: object
            properties:

              # Required.
              steps:
                description: Step counters
                $ref: "#/$defs/_stat-counters"

              # Required.
              actions:
                description: Action counters
                $ref: "#/$defs/_stat-counters"

              # Required.
              results:
                description: Result counters
                $ref: "#/$defs/_stat-counters"

            required:
              - steps
              - actions
              - results

  _stat-counters:
    description: Statistic counters
    type: object
    properties:

      # Required.
      executed:
        description: Number of items executed
        type: number

      # Required.
      total:
        description: Total number of items
        type: number

    required:
      - executed
      - total

  # 2. Main objects

  # 2.1. Scenario

  # Scenario -- common definition.
  # Defines the base object for `main-scenario` and `subscenario`.
  _scenario:
    description: Base scenario
    type: object
    allOf:

      # Scenario definition.
      - description: Scenario definition
        type: object
        properties:

          # Required.
          name:
            description: Name of the scenario
            $ref: "#/$defs/_non-empty-string"

          # Required.
          href:
            description: Reference to the scenario script path
            $ref: "#/$defs/_non-empty-string"

          # Required.
          attributes:
            description: Scenario attributes
            $ref: "#/$defs/_dict-str"

          # New in v0.3.0.
          # Optional.
          reqs:
            description: Requirement traceability
            type: array
            items: { $ref: "#/$defs/upstream-req-traceability" }

          # Required.
          steps:
            description: List of steps
            type: array
            items:
              anyOf:
                - $ref: "#/$defs/step-section"
                - $ref: "#/$defs/step-definition"

      # Base `_execution-results`.
      - $ref: "#/$defs/_execution-results"

      # Execution status.
      - description: Scenario execution status
        type: object
        properties:

          # Required.
          # Note:
          #   Could be inferred from `#/$defs/_execution-results/errors` & `warnings`.
          #   Keep it required whatever.
          status:
            description: Execution status
            anyOf:
              - const: "SUCCESS"
              - const: "WARNINGS"
              - const: "FAIL"

    required:
      - name
      - href
      - attributes
      - steps
      - status

  # Subscenario: Base `_scenario` as a final type.
  subscenario:
    description: Subscenario
    $ref: "#/$defs/_scenario"


  # 2.2. Steps

  # Step section: essentially a step description.
  step-section:
    description: Step section
    type: object
    properties:

      # Required.
      location:
        description: Location of the step
        $ref: "#/$defs/_location"

      # Required.
      description:
        description: Description of the step
        type: string

    required:
      - location
      - description

    # Make the difference with `step-definition` below.
    unevaluatedProperties: false

  # Full step definition.
  step-definition:
    description: Step definition
    type: object
    properties:

      # Required.
      location:
        description: Location of the step
        $ref: "#/$defs/_location"

      # Required.
      description:
        description: Description of the step
        # Regular step description may be `None`.
        anyOf:
          - type: string
          - type: "null"

      # New in v0.3.0.
      # Optional.
      reqs:
        description: Upstream traceability
        type: array
        items: { $ref: "#/$defs/upstream-req-traceability" }

      # Required.
      executions:
        description: Step executions
        type: array
        items: { $ref: "#/$defs/step-execution" }

      # Required.
      actions-results:
        description: List of actions and expected results
        type: array
        items: { $ref: "#/$defs/action-result-definition" }

    required:
      - location
      - description
      - executions
      - actions-results

  step-execution:
    description: Step execution results
    type: object
    allOf:

      # Base `_execution-results`.
      - $ref: "#/$defs/_execution-results"

      # Additional properties.
      - type: object
        properties:

          # Required.
          number:
            description: Execution number, starting from 1.
            type: number
            min: 1

        required:
          - number


  # 2.3. Actions / results

  action-result-definition:
    description: Action / result definition
    type: object
    properties:

      # Required.
      type:
        description: Action / result type
        oneOf:
          - const: "ACTION"
          - const: "RESULT"

      # Required.
      description:
        description: Action / result description
        type: string

      # New in v0.3.0.
      # Optional.
      indentation:
        description: Optional action/result indentation
        type: string

      # Required.
      executions:
        description: Action / result executions
        type: array
        items: { $ref: "#/$defs/action-result-execution" }

    required:
      - type
      - description
      - executions

  action-result-execution:
    description: Action / result execution results
    type: object
    allOf:

      # Base `_execution-results`.
      - $ref: "#/$defs/_execution-results"

      # Additional properties.
      - type: object
        properties:

          # Required.
          evidence:
            description: Evidence
            type: array
            items: { type: string }

          # Required.
          subscenarios:
            description: Subscenarios
            type: array
            items: { $ref: "#/$defs/subscenario" }

        required:
          - evidence
          - subscenarios


  # 2.4. Common objects and types

  _location:
    description: Location
    type: string

  _execution-results:
    description: Base execution results
    type: object
    properties:

      # Required.
      time:
        description: Execution times
        type: object
        properties:

          # Optional.
          start:
            description: Start time
            oneOf:
              - $ref: "#/$defs/_iso8601"
              - type: "null"

          # Optional.
          end:
            description: End time
            oneOf:
              - $ref: "#/$defs/_iso8601"
              - type: "null"

          # Optional.
          elapsed:
            description: Elapsed time in seconds
            oneOf:
              - type: number
              - type: "null"

      # Required.
      errors:
        description: Errors
        type: array
        items:
          anyOf:
            - { $ref: "#/$defs/error" }
            - { $ref: "#/$defs/known-issue" }

      # Required.
      warnings:
        description: Warnings
        type: array
        items:
          anyOf:
            - { $ref: "#/$defs/known-issue" }

    required:
      - time
      - errors
      - warnings

  error:
    description: Error
    type: object
    properties:

      # Optional: `type` may not be set.
      type:
        description: Error type
        type: string

      # Optional: `location` may not be set when `type` is not set.
      location:
        description: Error location
        $ref: "#/$defs/_location"

      # Required.
      message:
        description: Error message
        type: string

    required:
      - message

  known-issue:
    description: Known issue
    type: object
    properties:

      # Required.
      type:
        description: Error type
        const: "known-issue"

      # Required.
      location:
        description: Error location
        $ref: "#/$defs/_location"

      # New in v0.2.2.
      # Optional.
      level:
        description: Issue level
        type: number

      # Optional (changed in v0.2.2, was required before).
      id:
        description: Issue identifier
        type: string

      # New in v0.2.2.
      # Optional.
      url:
        description: Issue URL
        type: string

      # Required.
      message:
        description: Error message
        type: string

    required:
      - type
      - location
      - message

  _iso8601:
    description: ISO8601 date/time format
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?(((\\+|-)[0-9]{2}:[0-9]{2})|(Z([0-9]{4})?))?$"


  # 3. Traceability (new in v0.3.0)

  upstream-req-traceability:
    description: Upstream requirement traceability
    type: object
    properties:

      # Required.
      ref:
        description: Requirement or subref identifier being referenced.
        $ref: "#/$defs/_req-ref-id"

      # Optional
      comments:
        description: Justification comment attached with this link
        type: string

    required:
      - ref

  _req-ref-id:
    description: Requirement reference identifier
    $ref: "#/$defs/_non-empty-string"


  # 4. Basic types

  _non-empty-string:
    description: Non empty string type
    type: string
    minLength: 1

  _dict-str:
    description: Dictionary with string values type
    type: object
    patternProperties:
      ^.*$:
        type: string
