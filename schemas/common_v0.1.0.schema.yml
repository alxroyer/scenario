$schema: https://json-schema.org/draft/2020-12/schema

$id: https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.1.0.schema.json
title: Common definitions for scenario schemas v0.1.0
description: Schema that contains common definitions for schemas provided by the `scenario` library

# Define the main item as an empty object.
type: object
additionalProperties: false

$defs:

  # 1. Common `scenario` types

  # 1.1. Document heading properties

  _heading-properties:
    description: Heading properties
    type: object
    properties:

      # Optional.
      $schema:
        description: Schema reference
        # Note:
        #   Don't forbid backward compatible evolutions.
        #   Accept whatever, and let JSON schema validation state on compatibility.
        $ref: "#/$defs/non-empty-string"

    # Base object, don't forbid additional properties.
    additionalProperties: true


  # 1.2. Date / time

  iso8601:
    description: ISO8601 date/time format
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?(((\\+|-)[0-9]{2}:[0-9]{2})|(Z([0-9]{4})?))?$"


  # 1.3. Locations

  location:
    description: Location
    type: string


  # 1.4. Execution status

  execution-status:
    description: Execution status
    anyOf:
      - const: "SUCCESS"
      - const: "WARNINGS"
      - const: "FAIL"


  # 1.5. Errors and known issues

  array-of-errors:
    description: Array of errors
    type: array
    items:
      anyOf:
        - { $ref: "#/$defs/error" }
        - { $ref: "#/$defs/known-issue" }

  array-of-warnings:
    description: Array of warnings
    type: array
    items:
      anyOf:
        - { $ref: "#/$defs/known-issue" }

  error:
    description: Error
    type: object
    properties:

      # Optional: `type` may not be set.
      type:
        description: Error type
        type: string

      # Optional: `location` may not be set when `type` is not set.
      location:
        description: Error location
        $ref: "#/$defs/location"

      # Required.
      message:
        description: Error message
        type: string

    required:
      - message

  known-issue:
    description: Known issue
    type: object
    properties:

      # Required.
      type:
        description: Error type
        const: "known-issue"

      # Required.
      location:
        description: Error location
        $ref: "#/$defs/location"

      # Required.
      id:
        description: Issue identifier
        $ref: "#/$defs/non-empty-string"

      # Required.
      message:
        description: Error message
        type: string

    required:
      - type
      - location
      - id
      - message


  # 2. Basic types

  non-empty-string:
    description: Non empty string type
    type: string
    minLength: 1
