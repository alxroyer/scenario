$schema: https://json-schema.org/draft/2020-12/schema

$id: https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json
title: Common definitions for scenario schemas v0.3.0
description: Schema that contains common definitions for schemas provided by the `scenario` library.

# Subschema: define the main item as `null`.
type: "null"

$defs:

  # 1. Common `scenario` types

  # 1.1. Document heading properties

  _heading-properties:
    description: Heading properties.
    type: object
    properties:

      # New in v0.3.0.
      # Optional.
      $encoding:
        description: Encoding of the file.
        # Note:
        #   Don't use a restrictive enum definition.
        #   Accept whatever, and let Python raise an exception if the encoding is unknown.
        $ref: "#/$defs/non-empty-string"

      # New in v0.2.0.
      # Optional.
      $license:
        description: Ability to provide a license text for a JSON file.
        anyOf:
          - type: string
          - { type: array, items: { type: string } }

      # Optional.
      $schema:
        description: Schema reference.
        # Note:
        #   Don't forbid backward compatible evolutions.
        #   Accept whatever, and let JSON schema validation state on compatibility.
        $ref: "#/$defs/non-empty-string"

      # New in v0.3.0.
      # Optional.
      $version:
        description: "`scenario` version used to generate the file."
        # Note:
        #   Don't forbid backward compatible evolutions.
        #   Accept whatever, and let JSON schema validation state on compatibility.
        $ref: "#/$defs/non-empty-string"

    # Base object, don't forbid unevaluated properties.
    unevaluatedProperties: true


  # 1.2. Date / time

  iso8601:
    description: ISO8601 date/time format.
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?(((\\+|-)[0-9]{2}:[0-9]{2})|(Z([0-9]{4})?))?$"


  # 1.3. Locations

  location:
    description: Location.
    type: string


  # 1.4. Execution status

  execution-status:
    description: Execution status.
    anyOf:
      - const: "SUCCESS"
      - const: "WARNINGS"
      - const: "FAIL"


  # 1.5. Errors and known issues

  array-of-errors:
    description: Array of errors.
    type: array
    items:
      anyOf:
        - { $ref: "#/$defs/error" }
        - { $ref: "#/$defs/known-issue" }

  array-of-warnings:
    description: Array of warnings.
    type: array
    items:
      anyOf:
        - { $ref: "#/$defs/known-issue" }

  error:
    description: Error.
    type: object
    properties:

      # Optional: `type` may not be set.
      type:
        description: Error type.
        type: string

      # Optional: `location` may not be set when `type` is not set.
      location:
        description: Error location.
        $ref: "#/$defs/location"

      # Required.
      message:
        description: Error message.
        type: string

    required:
      - message

  known-issue:
    description: Known issue.
    type: object
    properties:

      # Required.
      type:
        description: Error type.
        const: "known-issue"

      # Required.
      location:
        description: Error location.
        $ref: "#/$defs/location"

      # New in v0.2.2.
      # Optional.
      level:
        description: Issue level.
        $ref: "#/$defs/issue-level"

      # Optional (changed in v0.2.2, was required before).
      id:
        description: Issue identifier.
        $ref: "#/$defs/issue-id"

      # New in v0.2.2.
      # Optional.
      url:
        description: Issue URL.
        type: string

      # Required.
      message:
        description: Error message.
        type: string

    required:
      - type
      - location
      - message

  # New in v0.2.2.
  issue-level:
    description: Issue level.
    type: integer

  issue-id:
    description: Issue identifier.
    $ref: "#/$defs/non-empty-string"


  # 1.6. Requirement management (new in v0.3.0)

  req-scenario-id:
    description: Scenario identifier, for requirement management.
    # See `ReqTraceabilityHelper.mkscenarioid()`.
    $ref: "#/$defs/non-empty-string"

  req-step-full-id:
    description: Full step identifier, in the context of its owner scenario, for requirement management.
    type: string
    # See `ReqTraceabilityHelper.mkstepfullid()`.
    pattern: "^step#.*$"

  req-step-short-id:
    description: Short step identifier, in the context of its owner scenario, for requirement management.
    type: string
    # See `ReqTraceabilityHelper.mkstepshortid()`.
    pattern: "^step#.*$"

  req-id:
    description: Requirement identifier.
    $ref: "#/$defs/non-empty-string"

  req-subref-id:
    description: Requirement subreference identifier.
    type: string
    pattern: "^.+/.+"

  req-ref-id:
    description: Any requirement reference identifier (i.e. either a `req-id` or a `req-subref-id`).
    $ref: "#/$defs/non-empty-string"


  # 2. Basic types

  non-empty-string:
    description: Non empty string type.
    type: string
    minLength: 1
