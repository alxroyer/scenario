$schema: https://json-schema.org/draft/2020-12/schema

$id: https://github.com/alxroyer/scenario/blob/master/schemas/downstream-traceability_v0.3.0.schema.json
title: Scenario downstream traceability v0.3.0
description: Schema that describes a downstream traceability report for the `scenario` library.

$ref: "#/$defs/main"

$defs:

  # 1. Main database node

  main:
    description: Scenario requirements.
    type: object

    allOf:

      # Heading properties.
      - description: Heading properties.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/_heading-properties"

      # Properties not starting with '$' are considered as requirement ids.
      - description: Requirements.
        type: object
        patternProperties:
          # Pattern compliant with '#/$defs/req-id' in the related 'common' schema.
          "^[^$].*$": { $ref: "#/$defs/req" }


  # 2. Objects

  # 2.1. Requirements

  req:
    description: Requirement.
    type: object
    properties:

      # Redundant with the main entry name.
      # id:
      #   description: Requirement identifier.
      #   $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/req-id"

      # Optional.
      title:
        description: Requirement title.
        type: string

      # Optional.
      text:
        description: Requirement text.
        type: string

      # Optional.
      subrefs:
        description: Requirement subreferences.
        type: object
        patternProperties:
          # Pattern compliant with '#/$defs/req-subref-id' in the related 'common' schema.
          "^[^$].*$": { $ref: "#/$defs/subref" }

      # Required.
      scenarios:
        description: Scenarios verifying this requirement.
        type: object
        patternProperties:
          # Pattern compliant with '#/$defs/req-scenario-id' in the related 'common' schema.
          "^[^$].*$": { $ref: "#/$defs/scenario" }

    required:
      - scenarios


  # 2.2. Requirement subreferences

  subref:
    description: Requirement subreference.
    type: object
    properties:

      # Redundant with the requirement `subrefs` entry name.
      # id:
      #   description: Requirement subreference identifier.
      #   $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/req-subref-id"

      # Optional.
      title:
        description: Requirement subreference title.
        type: string

      # Required.
      scenarios:
        description: Scenarios verifying this requirement subreference.
        type: object
        patternProperties:
          # Pattern compliant with '#/$defs/req-scenario-id' in the related 'common' schema.
          "^[^$].*$": { $ref: "#/$defs/scenario" }

    required:
      - scenarios


  # 2.3. Scenarios

  scenario:
    description: Scenario verifying a requirement or a requirement subreference.
    type: object
    properties:

      # Redundant with the requirement or requirement subreference `scenarios` entry name.
      # id:
      #   description: Scenario identifier (same as the scenario name).
      #   $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/req-scenario-id"

      # Redundant with the requirement or requirement subreference `scenarios` entry name.
      # name:
      #   description: Scenario name.
      #   $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/req-scenario-id"

      # Optional.
      title:
        description: Scenario title.
        type: string

      # Optional.
      comments:
        description: Comments for this scenario verifying the given requirement or requirement subreference.
        type: string

      # Optional.
      steps:
        description: Steps holding traceability information.
        type: object
        patternProperties:
          # Pattern compliant with '#/$defs/req-step-short-id' in the related 'common' schema.
          "^step#.*$": { $ref: "#/$defs/step" }

      # Optional.
      results:
        description: Execution results.
        $ref: "#/$defs/execution-results"

    # Nothing is required in the end for a scenario object.
    # required: []


  # 2.3. Steps

  step:
    description: Step verifying a requirement or a requirement subreference.
    type: object
    properties:

      # Redundant with the scenario `steps` entry name.
      # id:
      #   description: Full step identifier.
      #   $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/req-step-full-id"

      # Always generated, but may be considered as optional.
      name:
        description: Scenario name.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/non-empty-string"

      # Required.
      location:
        description: Step location.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/location"

      # Optional.
      description:
        description: Step description.
        type: string

      # Optional.
      comments:
        description: Comments for this step verifying the given requirement or requirement subreference.
        type: string

    required:
      - location


  # 3. Common types

  execution-results:
    description: Execution results, for scenarios and steps.
    type: object
    properties:

      # Required.
      status:
        description: Execution status.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/execution-status"

      # Required.
      errors:
        description: Errors.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/array-of-errors"

      # Required.
      warnings:
        description: Warnings.
        $ref: "https://github.com/alxroyer/scenario/blob/master/schemas/common_v0.3.0.schema.json#/$defs/array-of-warnings"

    required:
      - status
      - errors
      - warnings
